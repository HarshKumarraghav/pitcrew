# Live demo: the real dashboard replaying a recorded session (site/trace.json).
# Re-record with scripts/demo/record.mjs; the page itself is rebuilt from src/server/gui.html here.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "src/server/gui.html", "scripts/demo/build-site.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/demo/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
